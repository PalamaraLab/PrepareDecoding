name: "Unit tests: macOS"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:

  build-and-test:
    name: Unit tests on macOS
    runs-on: macos-15

    steps:

      - name: checkout repo & submodules
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: install system packages
        run: brew install libomp pkg-config automake autoconf autoconf-archive libtool

      - name: make build directory
        run: mkdir build_dir

      - name: cmake configure
        run: cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DCMAKE_CXX_COMPILER=clang++
        working-directory: build_dir

      - name: cmake build
        run: cmake --build . --parallel 4 --target unit_tests
        working-directory: build_dir

      - name: cmake test
        run: ctest -j4 --output-on-failure
        working-directory: build_dir
